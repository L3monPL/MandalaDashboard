<div class="dialog-wrap">

  <!-- Close -->
  <button class="btn-close" (click)="close()" aria-label="Zamknij">
    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
  </button>

  <!-- Main image -->
  <div class="stage">
    <div class="main-img" [class.fading]="isFading" [style.background-image]="activeImage?.bloob ? 'url(' + activeImage.bloob + ')' : 'none'">
      <div class="img-placeholder" *ngIf="!activeImage?.bloob">
        <div class="spinner"></div>
      </div>
    </div>

    <!-- Arrows -->
    <button class="arrow arrow-prev" (click)="prev()" [disabled]="activeIndex === 0" aria-label="Poprzednie">
      <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </button>
    <button class="arrow arrow-next" (click)="next()" [disabled]="isLastImage" aria-label="Następne">
      <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
    </button>

    <!-- Counter -->
    <span class="counter">{{ activeIndex + 1 }} / {{ imagesCount }}</span>
  </div>

  <!-- Side panel -->
  <aside class="panel">
    <div class="panel-header">
      <h2 class="panel-title">{{ data.title }}</h2>
      <div class="gold-line"></div>
      <p class="panel-desc">{{ data.description }}</p>
    </div>

    <div class="thumbs">
      <div
        *ngFor="let img of images; let i = index"
        class="thumb"
        [class.active]="activeIndex === i"
        (click)="select(i)"
      >
        <div
          class="thumb-img"
          [style.background-image]="img?.bloob ? 'url(' + img.bloob + ')' : 'none'"
        >
          <div class="thumb-placeholder" *ngIf="!img?.bloob"></div>
        </div>
      </div>
    </div>
  </aside>

</div>
