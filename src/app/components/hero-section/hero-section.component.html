<section class="hero">

  <!-- Brand text: above orbital -->
  <div class="hero-top">
    <p class="h-eyebrow">Zarządzanie Nieruchomościami</p>
    <h1 class="h-brand">MANDALA</h1>
  </div>

  <!-- Orbital visual -->
  <div class="hero-visual" aria-hidden="true">

    <div class="aura"></div>

    <svg class="ticks" viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg">
      <circle cx="210" cy="50"  r="2.5" fill="#C5A342" opacity=".55"/>
      <circle cx="370" cy="210" r="2.5" fill="#C5A342" opacity=".55"/>
      <circle cx="210" cy="370" r="2.5" fill="#C5A342" opacity=".55"/>
      <circle cx="50"  cy="210" r="2.5" fill="#C5A342" opacity=".55"/>
      <g stroke="#C5A342" stroke-width="1.2" opacity=".3">
        <line x1="210" y1="50" x2="210" y2="63" transform="rotate(45,210,210)"/>
        <line x1="210" y1="50" x2="210" y2="63" transform="rotate(135,210,210)"/>
        <line x1="210" y1="50" x2="210" y2="63" transform="rotate(225,210,210)"/>
        <line x1="210" y1="50" x2="210" y2="63" transform="rotate(315,210,210)"/>
      </g>
      <g stroke="#C5A342" stroke-width=".5" opacity=".07">
        <line x1="50"  y1="210" x2="370" y2="210"/>
        <line x1="210" y1="50"  x2="210" y2="370"/>
        <line x1="90"  y1="90"  x2="330" y2="330"/>
        <line x1="330" y1="90"  x2="90"  y2="330"/>
      </g>
    </svg>

    <div class="rail r-out"></div>
    <div class="rail r-mid"></div>
    <div class="rail r-in"></div>

    <div class="orbit o-out"></div>
    <div class="orbit o-out o-out-b"></div>

    <div class="orbit o-mid"></div>
    <div class="orbit o-mid o-mid-b"></div>
    <div class="orbit o-mid o-mid-c"></div>

    <div class="orbit o-in"></div>

    <div class="core">
      <div class="core-ring cr1"></div>
      <div class="core-ring cr2"></div>
      <img src="assets/logo/Mandala_zloto_sygnet.png" alt="Mandala" class="core-img">
    </div>

  </div>

  <!-- Brand text: below orbital -->
  <div class="hero-foot">
    <p class="h-sub">NIERUCHOMOŚCI</p>
    <div class="h-location">
      <span class="h-rule"></span>
      <span>Skórzewo &nbsp;·&nbsp; Poznań &nbsp;·&nbsp; Wielkopolska</span>
      <span class="h-rule"></span>
    </div>
  </div>

  <div class="scroll-hint">
    <span>Przewiń</span>
    <div class="scroll-line"></div>
  </div>

</section>
