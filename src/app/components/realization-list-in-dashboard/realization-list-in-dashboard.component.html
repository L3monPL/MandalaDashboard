<div class="panel">

  <div class="panel-header">
    <h2 class="panel-title">Lista realizacji</h2>
    <span class="count-badge" *ngIf="realizationsList?.length">{{ realizationsList!.length }}</span>
  </div>

  <div class="panel-body">

    <!-- Loading -->
    <div class="empty-state" *ngIf="loadingRealizationsList">
      <div class="spinner"></div>
      <p>Ładowanie...</p>
    </div>

    <!-- Empty -->
    <div class="empty-state" *ngIf="!loadingRealizationsList && !realizationsList?.length">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      <p>Brak realizacji</p>
    </div>

    <!-- List -->
    <div class="list" *ngIf="!loadingRealizationsList && realizationsList?.length">
      <div class="item" *ngFor="let realization of realizationsList; let i = index">

        <div class="item-thumb">
          <img *ngIf="realization.images[0]?.bloob" [src]="realization.images[0].bloob" [alt]="realization.title">
          <div class="thumb-placeholder" *ngIf="!realization.images[0]?.bloob">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21,15 16,10 5,21"/>
            </svg>
          </div>
        </div>

        <div class="item-info">
          <span class="item-index">{{ (i + 1) < 10 ? '0' + (i + 1) : (i + 1) }}</span>
          <span class="item-title">{{ realization.title }}</span>
        </div>

        <button class="item-preview" (click)="openPreview(realization)" title="Podgląd realizacji">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>

        <button class="item-delete" (click)="deleteRealization(realization.id, realization.title)" title="Usuń realizację">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3,6 5,6 21,6"/>
            <path d="M19,6l-1,14a2 2 0 01-2,2H8a2 2 0 01-2-2L5,6"/>
            <path d="M10,11v6M14,11v6"/>
            <path d="M9,6V4a1 1 0 011-1h4a1 1 0 011,1v2"/>
          </svg>
        </button>

      </div>
    </div>

  </div>
</div>
